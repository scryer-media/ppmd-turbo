name: ci

# fmt, clippy, tests on every desktop platform, the unsafe-code lanes (Miri,
# Memcheck and AddressSanitizer; see docs/unsafe-validation.md), a short
# deterministic fuzz run of every target, docs, MSRV and packaging. fuzz-extended.yml runs the long campaigns on demand.
# `ci-complete` is the one required check: it fails when any lane does.

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ppmd-turbo-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.97.1
  # Miri and cargo-fuzz need a nightly; pinned, so a run is reproducible and a
  # nightly regression is not mistaken for a finding.
  NIGHTLY_TOOLCHAIN: nightly-2026-09-01
  CARGO_FUZZ_VERSION: 0.13.2
  # The tests Miri runs, before discovery drops the ones cfg(miri) ignores.
  MIRI_SELECTION: kind(lib) | binary(coder_differential) | binary(encode_carryless)

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all --check
      - run: cargo fmt --all --check --manifest-path fuzz/Cargo.toml

  clippy:
    name: clippy-${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: macos-aarch64
            runner: macos-15
          - platform: windows-x86_64
            runner: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - name: All features
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Default features
        run: cargo clippy --locked --all-targets -- -D warnings

  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo doc --locked --no-deps --all-features

  # Every generated fixture, written once from the committed recipes and
  # handed to the lanes that read them. None is committed. The job fails if
  # any oracle is missing or any file differs from
  # tools/ppmd-corpus/fixtures.sha256, so no row is silently skipped.
  fixtures:
    name: fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install 7-Zip
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends 7zip
          sevenzip="$(command -v 7zz || command -v 7z)"
          "$sevenzip" | head -n 3
          echo "SEVENZIP=$sevenzip" >> "$GITHUB_ENV"
      - name: Regenerate every fixture
        run: cargo run --locked --release -p ppmd-corpus -- fixtures --require-all --sevenzip "$SEVENZIP"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fixtures
          path: |
            tests/fixtures/7z/
            tests/fixtures/rar/
            tests/hostile_fixtures/
            fuzz/seeds/
            fuzz/regressions/
          if-no-files-found: error
          retention-days: 7

  test:
    name: test-${{ matrix.platform }}
    needs: fixtures
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      # A missing fixture fails the suite instead of being skipped.
      PPMD_TURBO_REQUIRE_FIXTURES: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: macos-aarch64
            runner: macos-15
          - platform: macos-x86_64
            runner: macos-15-intel
          - platform: windows-x86_64
            runner: windows-2025
          - platform: windows-aarch64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: cargo-nextest@0.9.143
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fixtures
      # Nextest runs every test in its own process, so one test's crash or
      # leaked state cannot hide another's result. It does not run doctests;
      # `cargo test --doc` does, for each feature set.
      - name: Test all features
        run: cargo nextest run --locked --workspace --all-features --no-fail-fast
      - name: Doctests, all features
        run: cargo test --doc --locked --workspace --all-features --no-fail-fast
      - name: Test default features
        run: cargo nextest run --locked --no-fail-fast
      - name: Doctests, default features
        run: cargo test --doc --locked --no-fail-fast

  # The unsafe-code lanes. docs/unsafe-validation.md says what each one
  # covers and what stays uninstrumented; `unsafe-complete` requires them all.
  # The instrumented native lanes run the release build: debug builds check
  # every arena access with `debug_assert!`, so only the release build reaches
  # the unchecked accessors that Memcheck and ASan are there to watch. The
  # binary-oracle tests (7zz, unrar) are ignored and stay out.
  unsafe-valgrind:
    name: unsafe-valgrind-${{ matrix.platform }}
    needs: fixtures
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
    env:
      PPMD_TURBO_REQUIRE_FIXTURES: "1"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: valgrind --quiet --error-exitcode=1 --leak-check=full --errors-for-leak-kinds=definite,indirect
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: valgrind --quiet --error-exitcode=1 --leak-check=full --errors-for-leak-kinds=definite,indirect
      # Symbols and line tables, so a Memcheck report names the code.
      CARGO_PROFILE_RELEASE_STRIP: "false"
      CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: cargo-nextest@0.9.143
      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends valgrind
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fixtures
      - name: Every test in the crate under Memcheck, release build
        run: cargo nextest run --locked --release --all-features --no-fail-fast

  # AddressSanitizer with an instrumented standard library. The crate has no
  # threads of its own, so there is no ThreadSanitizer lane.
  unsafe-asan:
    name: unsafe-asan-${{ matrix.platform }}
    needs: fixtures
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    env:
      PPMD_TURBO_REQUIRE_FIXTURES: "1"
      RUSTFLAGS: -Zsanitizer=address
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.NIGHTLY_TOOLCHAIN }}
          components: rust-src
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: cargo-nextest@0.9.143
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fixtures
      # `--target` keeps any build script and proc macro uninstrumented.
      - name: Every test in the crate under ASan, release build
        run: cargo "+$NIGHTLY_TOOLCHAIN" nextest run -Zbuild-std --target "$TARGET" --locked --release --all-features --no-fail-fast

  # Miri, one job per test, discovered from the cfg(miri) build so that a new
  # test in the selection gets its own job without editing this file. The
  # conformance and coder-differential suites are compiled out under Miri;
  # the hostile suites and encode_7z decode whole streams and take Miri past
  # the job limit a test. All of them run under Memcheck and ASan above.
  unsafe-miri-plan:
    name: unsafe-miri-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.NIGHTLY_TOOLCHAIN }}
          components: miri, rust-src
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: cargo-nextest@0.9.143
      - name: Discover every test Miri runs
        id: plan
        run: |
          cargo "+$NIGHTLY_TOOLCHAIN" miri nextest list --locked --all-features \
            --message-format json -E "$MIRI_SELECTION" > "$RUNNER_TEMP/miri-tests.json"
          python3 .github/scripts/miri-matrix.py "$RUNNER_TEMP/miri-tests.json" "$GITHUB_OUTPUT"

  unsafe-miri:
    name: unsafe-miri-${{ matrix.binary }}-${{ matrix.test }}
    needs: unsafe-miri-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.unsafe-miri-plan.outputs.matrix) }}
    env:
      # Isolation stays on: nothing Miri runs reads a file or a clock.
      MIRIFLAGS: -Zmiri-strict-provenance
      MIRI_BINARY: ${{ matrix.binary }}
      MIRI_TEST: ${{ matrix.test }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.NIGHTLY_TOOLCHAIN }}
          components: miri, rust-src
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: cargo-nextest@0.9.143
      - name: One test under Miri
        run: |
          cargo "+$NIGHTLY_TOOLCHAIN" miri nextest run --locked --all-features --no-fail-fast \
            -E "binary_id($MIRI_BINARY) & test(=$MIRI_TEST)"

  unsafe-complete:
    name: unsafe-complete
    if: always()
    needs: [unsafe-valgrind, unsafe-asan, unsafe-miri-plan, unsafe-miri]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # A skipped or cancelled lane is as much a gap as a failed one.
      - name: Require every native and Miri safety lane
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 -c 'import json, os; assert all(job["result"] == "success" for job in json.loads(os.environ["RESULTS"]).values()), os.environ["RESULTS"]'

  # The fuzz harness library, including the seed generator's own checks
  # (the fixtures job checks the generated seeds against their digests).
  fuzz-harness:
    name: fuzz-harness
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: cargo-nextest@0.9.143
      - name: Clippy
        run: cargo clippy --locked --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings
      - name: Harness tests
        run: cargo nextest run --locked --manifest-path fuzz/Cargo.toml --lib --no-fail-fast

  # A short, deterministic run of every target on both 64-bit Linux
  # architectures: a fixed libFuzzer seed and a fixed iteration count per
  # target, starting from the generated seeds. cargo-fuzz builds with
  # AddressSanitizer. A crash fails the lane; the input is kept as an
  # artifact.
  fuzz:
    name: fuzz-${{ matrix.platform }}-${{ matrix.target }}
    needs: fixtures
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x86_64, linux-aarch64]
        target:
          - decode_7z
          - decode_rar
          - decode_differential_7z
          - roundtrip_7z
          - roundtrip_carryless
          - structure_7z
          - range_coders
          - checked_vs_unchecked
          - model_ops
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          # Iterations sized to about a minute each on a hosted runner.
          - target: decode_7z
            runs: 20000
          - target: decode_rar
            runs: 20000
          - target: decode_differential_7z
            runs: 20000
          - target: roundtrip_7z
            runs: 5000
          - target: roundtrip_carryless
            runs: 5000
          - target: structure_7z
            runs: 2000
          - target: range_coders
            runs: 50000
          - target: checked_vs_unchecked
            runs: 10000
          - target: model_ops
            runs: 5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.NIGHTLY_TOOLCHAIN }}
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fixtures
      - name: Fuzz
        env:
          TARGET: ${{ matrix.target }}
          RUNS: ${{ matrix.runs }}
        run: |
          mkdir -p "fuzz/corpus/$TARGET"
          corpora=("fuzz/corpus/$TARGET" "fuzz/seeds/$TARGET")
          # Minimised past crashes replay first, on every run.
          if [ -d "fuzz/regressions/$TARGET" ]; then
            corpora+=("fuzz/regressions/$TARGET")
          fi
          cargo "+$NIGHTLY_TOOLCHAIN" fuzz run "$TARGET" "${corpora[@]}" -- \
            -runs="$RUNS" -seed=1 -rss_limit_mb=2048 -print_final_stats=1
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-findings-${{ matrix.platform }}-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore

  msrv:
    name: msrv
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read rust-version from the crate manifest
        id: msrv
        run: |
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MSRV=$version" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: The crate
        run: cargo "+$MSRV" check --locked --all-features

  package:
    name: package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: The crates.io archive builds
        run: cargo package --locked -p ppmd-turbo

  ci-complete:
    name: ci-complete
    if: always()
    needs: [fmt, clippy, docs, fixtures, test, unsafe-complete, fuzz-harness, fuzz, msrv, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail if any required lane failed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"result": *"(failure|cancelled)"'; then
            exit 1
          fi
