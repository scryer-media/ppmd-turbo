[package]
name = "ppmd-oracle"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
description = "Out-of-process 7zz and unrar oracle checks for ppmd-turbo"
publish = false

[[bin]]
name = "ppmd-oracle"
path = "src/main.rs"

[dependencies]
crc32fast = "1.5"
# The RAR 1.5-4.x member parser and the RAR3 escape layer, for check-rar.
ppmd-corpus = { path = "../ppmd-corpus" }
ppmd-rust = "=1.5.0"
ppmd-turbo = { path = "../.." }

[lints.rust]
missing_docs = "warn"
