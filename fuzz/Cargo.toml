[package]
name = "ppmd-turbo-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ppmd-turbo = { path = ".." }

[[bin]]
name = "decode_7z"
path = "fuzz_targets/decode_7z.rs"
test = false
doc = false
bench = false

[[bin]]
name = "range_coders"
path = "fuzz_targets/range_coders.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1

[workspace]
