[package]
name = "ppmd-turbo"
version = "0.1.1"
edition = "2024"
rust-version = "1.97.1"
authors = ["NZB Man"]
license = "Apache-2.0"
keywords = ["ppmd", "compression", "7z", "rar", "decompression"]
categories = ["compression", "encoding"]
homepage = "https://github.com/scryer-media/ppmd-turbo"
repository = "https://github.com/scryer-media/ppmd-turbo"
description = "PPMd variant H (Ppmd7) compression and decompression, bit-exact with 7-Zip and RAR, performance-first"
readme = "README.md"
# Repository scaffolding that has no business in the crate archive.
exclude = [
    ".github/", ".gitleaks.toml", ".gitattributes", "renovate.json", "AGENTS.md",
    "bench/", "docs/", "fuzz/", "tests/", "tools/", "rust-toolchain.toml", "rustfmt.toml",
]

[features]
default = ["std"]
# The io adapters, std::error::Error and run-time SIMD detection.
std = []
# The engine, for the crate's own fuzz targets, benches and differential
# tests. Hidden and unstable.
internals = []

[dependencies]

[dev-dependencies]
# Differential oracle for the coders (tests/coder_differential.rs). Test-only:
# it never reaches the published crate's graph.
ppmd-rust = "=1.5.0"
# The conformance suites read tests/fixtures/manifest.json and compare SHA-256
# digests. Test-only: neither reaches the published crate's graph.
serde_json = "1.0.149"
sha2 = "0.10.9"
# The 7z container CRCs in tests/differential_binaries.rs.
crc32fast = "1.5"
# The conformance suites build the ppmd-rust fixture streams in process when
# they are not on disk, through the same code as `ppmd-corpus fixtures`. A
# path-only dev-dependency: cargo drops it from the published manifest.
ppmd-corpus = { path = "tools/ppmd-corpus" }

# The encoder suites check streams against the bare model and coders.
[[test]]
name = "encode_7z"
required-features = ["internals"]

[[test]]
name = "encode_carryless"
required-features = ["internals"]

[[test]]
name = "encode_oracle_7zz"
required-features = ["internals"]

# Repository tools (oracles, bench drivers) join as `tools/<name>` members so
# their dependencies never reach this crate's own graph. The fuzz harness is
# its own workspace, built on nightly by cargo-fuzz.
[workspace]
members = ["tools/ppmd-bench", "tools/ppmd-corpus", "tools/ppmd-oracle"]
exclude = ["fuzz"]
resolver = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3

# Benchmarks and profiling want symbols without giving up codegen.
[profile.profiling]
inherits = "release"
strip = false
debug = 1

# Tests need no debuginfo. Without it, and without incremental state, a cold
# `cargo test --workspace --all-features --no-run` is 3.9 s instead of 5.1 s
# (12 CPU-s instead of 19); the test run is not slower.
[profile.test]
debug = 0
split-debuginfo = "off"
incremental = false

# Dev and test builds optimise only what dominates test time; debug assertions
# and overflow checks stay on, so the arena's `debug_assert!` bounds checks
# still run. Measured once per configuration on an Apple M5 Max: cold is
# `cargo test --workspace --all-features --no-run` from an empty target
# directory, the run is `cargo nextest run --workspace --all-features` with the
# fixtures on disk, warm is the rebuild after touching src/model.rs.
#
# ppmd-turbo itself: the run takes 5.4 s instead of 14.5 s (13 CPU-s instead of
# 69), for 1.3 s more cold build (5.3 s instead of 3.9 s) and 4.4 s more warm
# rebuild (5.2 s instead of 0.9 s), because every test binary is optimised too.
#
# Measured and left out, because none saved more than it cost. With the
# override above in place: ppmd-rust, the oracle (run 5.2 s), sha2, the fixture
# digests (run 5.6 s), and ppmd-corpus, the in-process fixture builders (run
# 5.3 s and 8 CPU-s instead of 13, for 1.7 s and 6 CPU-s more cold build).
# ppmd-rust alone, without it, saved nothing either (run 25.2 s).
[profile.dev.package.ppmd-turbo]
opt-level = 3

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
